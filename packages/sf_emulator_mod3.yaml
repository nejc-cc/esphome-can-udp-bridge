# Emulated Solarfocus electronic module at device address 3.
# Included by sfcantunnel1.yaml and sfcantunnel3.yaml, so it can run on either:
# on tun1 it answers the HMI directly on its own bus (no tunnel in the reply
# path, as on copper), on tun3 it answers through the tunnel.
#
# Only one may answer at a time. The emulator enforces that itself: it will not
# start while anything else answers 0x223 (the other node, or a real module set
# to address 3), and if one appears while it is running it stops. Turn the other
# one off first; the switch drops back to off and the status says why if not.
#
# Three numbering systems refer to this one device, so mind which is which:
#   device address (rotary switch) = 3
#   heating circuits it serves     = 7 and 8
#   what the HMI labels it         = 4 (DHW 4, circulation)
# Entity names below use whichever numbering you would look for them under.

sf_module_emulator:
  - id: sfmod3
    can_udp_bridge_id: can_bridge
    address: 3
    pump_a:
      name: "HC7 Pump"
    pump_b:
      name: "HC8 Pump"
    mixer_a_open:
      name: "HC7 Mixer Open"
    mixer_a_close:
      name: "HC7 Mixer Close"
    mixer_b_open:
      name: "HC8 Mixer Open"
    mixer_b_close:
      name: "HC8 Mixer Close"
    dhw_pump:
      name: "DHW Pump"
    circulation:
      name: "Circulation Pump"

switch:
  # Shows the request as the emulator sees it, not just what was clicked: it
  # falls back to off by itself when the interlock refuses or stops emulation.
  # RESTORE_DEFAULT_OFF: a board that reboots comes back as it was left, and a
  # fresh one never starts answering on its own.
  - platform: template
    name: "Module 3 Emulation"
    id: sfmod3_enable
    lambda: return id(sfmod3).get_enabled();
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    turn_on_action:
      - lambda: id(sfmod3).set_enabled(true);
    turn_off_action:
      - lambda: id(sfmod3).set_enabled(false);

text_sensor:
  - platform: template
    name: "Module 3 Emulation Status"
    entity_category: diagnostic
    update_interval: 2s
    lambda: return id(sfmod3).get_status();

sensor:
  # Each time the HMI (re)opens its session with the module it starts with an
  # identification request, with all outputs off. Counts from when emulation
  # last started, so one run on tun3 and one on tun1 compare directly.
  - platform: template
    name: "Module 3 Ident Requests"
    entity_category: diagnostic
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: 30s
    lambda: return (float) id(sfmod3).get_ident_requests();

# Simulated sensors; until real ones are wired, these drive what the module
# reports. 270.0 = not connected, the value a real module sends for an empty
# input. Slots without an entry here (buffer tank sensors and the two slots
# with no known effect) are never set and report 270.0.
#
# on_value rather than set_action: a restored value is published at boot and
# fires on_value too, so no on_boot block is needed to push values in.
number:
  - platform: template
    name: "HC7 Flow Temperature"
    id: hc7_flow
    optimistic: true
    restore_value: true
    initial_value: 30.0
    min_value: -20.0
    max_value: 95.0
    step: 0.1
    unit_of_measurement: "°C"
    on_value:
      - lambda: id(sfmod3).set_flow_a(x);
  - platform: template
    name: "HC8 Flow Temperature"
    id: hc8_flow
    optimistic: true
    restore_value: true
    initial_value: 30.0
    min_value: -20.0
    max_value: 95.0
    step: 0.1
    unit_of_measurement: "°C"
    on_value:
      - lambda: id(sfmod3).set_flow_b(x);
  - platform: template
    name: "DHW 4 Tank"
    id: aux_dhw_tank
    optimistic: true
    restore_value: true
    initial_value: 270.0
    min_value: -20.0
    max_value: 270.0
    step: 0.1
    unit_of_measurement: "°C"
    entity_category: config
    on_value:
      - lambda: id(sfmod3).set_aux(2, x);
  - platform: template
    name: "Circulation Sensor"
    id: aux_circulation
    optimistic: true
    restore_value: true
    initial_value: 270.0
    min_value: -20.0
    max_value: 270.0
    step: 0.1
    unit_of_measurement: "°C"
    entity_category: config
    on_value:
      - lambda: id(sfmod3).set_aux(3, x);
