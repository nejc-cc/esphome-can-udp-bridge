# Solarfocus CAN tunnel 2 — HC2 module segment (192.0.2.12)
# Mesh: list every OTHER tunnel node here.
substitutions:
  device_name: sfcantunnel2
  friendly_name: "SF CAN Tunnel 2 (HC)"
  # --- board / ethernet (WT32-ETH01) ---
  board: wt32-eth01
  eth_type: LAN8720
  eth_mdc_pin: GPIO23
  eth_mdio_pin: GPIO18
  eth_clk_mode: CLK_EXT_IN
  eth_clk_pin: "0"
  eth_phy_addr: "1"
  eth_power_pin: GPIO16
  # --- CAN transceiver wiring (SN65HVD230: TX->D/CTX, RX<-R/CRX) ---
  can_tx_pin: "14"
  can_rx_pin: "4"
  # --- tunnel behaviour ---
  can_bit_rate: "100000"
  can_mode: bridge               # bridge | listen_only
  tunnel_port: "20000"
  tunnel_buffer_frames: "1"      # 1 = per-frame forwarding; do NOT batch
  tunnel_buffer_timeout: 2ms
  tunnel_peer_timeout: 5s
  tunnel_keepalive: 1s
  # --- status LEDs (active-low) ---
  led_traffic_pin: GPIO5
  led_peer_pin: GPIO17
  # --- misc ---
  log_baud_rate: "115200"
  web_port: "80"

packages:
  common: !include packages/can_bridge_common.yaml

ethernet:
  manual_ip:
    static_ip: !secret ip_sfcantunnel2
    gateway: !secret gateway
    subnet: !secret subnet
    dns1: !secret dns1

can_udp_bridge:
  peers:
    - !secret ip_sfcantunnel1
    - !secret ip_sfcantunnel3

api:
  encryption:
    key: !secret sfcantunnel2__encryption_key
