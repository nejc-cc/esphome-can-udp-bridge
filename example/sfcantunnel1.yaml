# Solarfocus CAN tunnel 1 — HMI segment (192.0.2.11)
# Mesh: list every OTHER tunnel node here.
substitutions:
  device_name: sfcantunnel1
  friendly_name: "SF CAN Tunnel 1 (HMI)"
  # --- board / ethernet (WT32-ETH01) ---
  board: wt32-eth01
  eth_type: LAN8720
  eth_mdc_pin: GPIO23
  eth_mdio_pin: GPIO18
  eth_clk_mode: CLK_EXT_IN
  eth_clk_pin: "0"
  eth_phy_addr: "1"
  eth_power_pin: GPIO16
  # --- CAN transceiver wiring (SN65HVD230) ---
  # NOTE: SWAPPED vs the reference wiring on purpose. D/CTX and R/CRX are
  # mirrored on this home-made carrier PCB, so TX must drive GPIO4 and RX must
  # read GPIO14. Not a typo - do not "fix" it back without checking the board.
  # Symptom if it is wrong: CAN RX Rate 0 AND Bus Errors 0 (a wiring fault that
  # produced garbage would show errors climbing instead).
  can_tx_pin: "4"
  can_rx_pin: "14"
  # --- tunnel behaviour ---
  can_bit_rate: "100000"
  can_mode: bridge               # bridge | listen_only
  tunnel_port: "20000"
  tunnel_buffer_frames: "1"      # 1 = per-frame forwarding; do NOT batch
  tunnel_buffer_timeout: 2ms
  tunnel_peer_timeout: 5s
  tunnel_keepalive: 1s
  # --- status LEDs (active-low) ---
  led_traffic_pin: GPIO5
  led_peer_pin: GPIO17
  # --- misc ---
  log_baud_rate: "115200"
  web_port: "80"

packages:
  common: !include packages/can_bridge_common.yaml

ethernet:
  manual_ip:
    static_ip: !secret ip_sfcantunnel1
    gateway: !secret gateway
    subnet: !secret subnet
    dns1: !secret dns1

can_udp_bridge:
  peers:
    - !secret ip_sfcantunnel2
#    - !secret ip_sfcantunnel3



api:
  encryption:
    key: !secret sfcantunnel1__encryption_key
